<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quick Settings preview</title>
<link rel="stylesheet" href="../app/style.css">
<style>
  /* Stand-in for the video under the transparent window. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(135deg, #24476b, #6b8fa8 45%, #c9a47a);
  }
</style>
</head>
<body>
<!-- Desktop preview: fake Luna services, then the real app. Scaled to fit the window. -->
<script src="stub.js"></script>
<script src="../app/app.js"></script>
<script>
  const fit = () => { document.documentElement.style.zoom = Math.min(innerWidth / 1920, innerHeight / 1080); };
  addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
